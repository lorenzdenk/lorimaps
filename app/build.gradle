plugins {
    id 'com.android.application'
}

android {
    namespace "io.github.lorenzdenk.lorimaps"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.lorenzdenk.lorimaps"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "2.0.0"
        // phones and tablets only (no x86 emulators): half the APK size
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        // fixed debug key (in the repo) so that each GitHub build can be installed as an update
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'

    // map renderer (vector and raster), OpenGL ES variant: runs on all devices
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
    // MapLibre loads tiles with OkHttp; the app sets its own client (User-Agent)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
